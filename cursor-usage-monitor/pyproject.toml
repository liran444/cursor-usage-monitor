[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-usage-monitor"
version = "0.1.0"
description = "Cross-platform system tray monitor for Cursor usage (usage-summary API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Golan" }]
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
cursor-usage = "cursor_usage.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cursor_usage*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
