[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-usage-app"
version = "0.1.1"
description = "Cursor usage monitor (clean-slate rebuild)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "browser-cookie3>=0.19",
    "httpx>=0.27",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pyperclip>=1.8",
    "PySide6>=6.6",
    "qt-material-icons>=0.5",
    "rookiepy>=0.5",
]

[project.optional-dependencies]
browser = [
    "rookiepy>=0.5",
    "browser-cookie3>=0.19",
]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
cursor-usage = "cursor_usage_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
