name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          ./scripts/install/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/CursorUsageSetup-*-x64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pkg
        run: |
          chmod +x scripts/build/build.sh scripts/install/macos/*.sh scripts/install/macos/scripts/postinstall
          ./scripts/install/macos/build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/CursorUsage-*-macos-*.pkg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself
      - name: Build PyInstaller dist
        run: |
          chmod +x scripts/build/build.sh scripts/install/linux/*.sh
          ./scripts/build/build.sh
      - name: Dry-run install core
        run: |
          export CURSOR_USAGE_INSTALL_DRY_RUN=1
          export PAYLOAD_DIR="$PWD/dist/cursor-usage"
          source scripts/install/linux/install_core.sh
          cursor_usage_install_app "$PAYLOAD_DIR"
      - name: Build .run installer
        run: ./scripts/install/linux/make-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: release/CursorUsageSetup-*-linux-x86_64.run
